<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Família Santos">
<meta name="theme-color" content="#0a0a0a">
<title>Gestão Financeira · Família Santos</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#0a0a0a;--surface:#141414;--surface2:#1e1e1e;--surface3:#282828;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#efefef;--text2:#909090;--text3:#505050;
  --green:#22c58b;--green-dim:rgba(34,197,139,0.12);
  --red:#f05252;--red-dim:rgba(240,82,82,0.12);
  --amber:#f59e0b;--amber-dim:rgba(245,158,11,0.12);
  --blue:#60a5fa;--blue-dim:rgba(96,165,250,0.12);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,0.12);
  --pink:#f472b6;--pink-dim:rgba(244,114,182,0.12);
  --r:12px;--r-sm:8px;
  --safe-b:env(safe-area-inset-bottom,0px);--nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#topbar{flex-shrink:0;padding:14px 18px 0;display:flex;align-items:center;justify-content:space-between}
#scroller{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px;padding-bottom:calc(var(--nav-h)+28px+var(--safe-b))}
#scroller::-webkit-scrollbar{display:none}
#navbar{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h)+var(--safe-b));padding-bottom:var(--safe-b);background:rgba(10,10,10,0.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:0.5px solid var(--border2);display:flex;z-index:100}
.tb-title{font-size:20px;font-weight:650;letter-spacing:-0.4px}
.tb-sub{font-size:12px;color:var(--text3);margin-top:1px}
.tb-family{font-size:10px;font-weight:600;color:var(--green);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:1px}
.month-pill{font-size:12px;font-weight:500;color:var(--green);background:var(--green-dim);border:none;border-radius:99px;padding:5px 13px;cursor:pointer}
.nb-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:transparent;color:var(--text3);font-size:9px;font-weight:500;cursor:pointer;padding:0;transition:color .15s}
.nb-btn.active{color:var(--green)}
.nb-icon{font-size:19px;line-height:1}
.nb-add{width:42px;height:42px;border-radius:14px;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:22px;color:#000;margin-bottom:2px;box-shadow:0 4px 16px rgba(34,197,139,0.4)}
.card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.span2{grid-column:1/-1}
.m-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.m-value{font-size:22px;font-weight:650;letter-spacing:-0.8px}
.m-value.sm{font-size:17px}.m-value.xs{font-size:14px}
.m-sub{font-size:12px;color:var(--text3);margin-top:3px}
.m-green{color:var(--green)}.m-red{color:var(--red)}.m-blue{color:var(--blue)}.m-amber{color:var(--amber)}.m-purple{color:var(--purple)}
.prog-track{height:5px;background:var(--surface3);border-radius:99px;overflow:hidden;margin-top:10px}
.prog-fill{height:100%;border-radius:99px;transition:width .5s ease}
.sec{margin-top:18px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.sec-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em}
.sec-action{font-size:13px;color:var(--green);background:none;border:none;cursor:pointer}
.txn-list{display:flex;flex-direction:column;gap:7px}
.swipe-wrap{border-radius:var(--r-sm);overflow:hidden;position:relative}
.swipe-bg{position:absolute;inset:0;background:var(--red-dim);display:flex;align-items:center;justify-content:flex-end;padding-right:16px}
.swipe-bg span{font-size:13px;color:var(--red);font-weight:500}
.txn-row{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r-sm);padding:11px 13px;display:flex;align-items:center;gap:11px;will-change:transform;transition:transform .18s;cursor:pointer}
.txn-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.txn-info{flex:1;min-width:0}
.txn-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-meta{font-size:11px;color:var(--text3);margin-top:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.txn-amount{font-size:14px;font-weight:600;white-space:nowrap}
.txn-amount.debit{color:var(--red)}
.txn-amount.credit{color:var(--green)}
.badge{font-size:10px;padding:2px 6px;border-radius:99px;font-weight:500;display:inline-block}
.b-fixo{background:var(--blue-dim);color:var(--blue)}
.b-var{background:var(--amber-dim);color:var(--amber)}
.b-income{background:var(--green-dim);color:var(--green)}
.b-src{background:var(--surface3);color:var(--text3)}
.bar-list{display:flex;flex-direction:column;gap:12px}
.bar-row{display:flex;flex-direction:column;gap:4px}
.bar-top{display:flex;justify-content:space-between;align-items:baseline}
.bar-cat{font-size:13px}.bar-val{font-size:12px;color:var(--text2)}
.bar-track{height:4px;background:var(--surface3);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .6s ease}
.form-block{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden}
.frow{display:flex;align-items:center;border-bottom:0.5px solid var(--border)}
.frow:last-child{border-bottom:none}
.flabel{font-size:13px;color:var(--text2);padding:0 14px;min-width:100px;flex-shrink:0}
.frow input,.frow select{flex:1;background:transparent;border:none;color:var(--text);font-size:15px;padding:13px 13px 13px 0;outline:none;-webkit-appearance:none;appearance:none}
.frow input::placeholder{color:var(--text3)}
.frow select option{background:#1a1a1a}
.btn{width:100%;padding:14px;border-radius:var(--r);border:none;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{opacity:.8}
.btn-green{background:var(--green);color:#000}
.btn-ghost{background:var(--surface2);color:var(--text);border:0.5px solid var(--border2)}
.btn-red{background:var(--red-dim);color:var(--red);border:0.5px solid rgba(240,82,82,.25)}
.btn-blue{background:var(--blue-dim);color:var(--blue);border:0.5px solid rgba(96,165,250,.25)}
.btn-amber{background:var(--amber-dim);color:var(--amber);border:0.5px solid rgba(245,158,11,.25)}
.tabs{display:flex;background:var(--surface2);border-radius:var(--r-sm);padding:3px;gap:3px;margin-bottom:12px}
.tab{flex:1;padding:7px;border:none;background:transparent;color:var(--text3);font-size:12px;font-weight:500;border-radius:7px;cursor:pointer;transition:all .15s}
.tab.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat-opt{padding:12px 6px;border:0.5px solid var(--border);border-radius:var(--r-sm);background:var(--surface2);text-align:center;cursor:pointer;transition:all .15s}
.cat-opt.on{border-color:var(--green);background:var(--green-dim)}
.cat-ico{font-size:20px;display:block;margin-bottom:4px}
.cat-lbl{font-size:11px;color:var(--text3)}
.cat-opt.on .cat-lbl{color:var(--green)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:all}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;padding:0 0 calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:92vh;overflow-y:auto}
.overlay.open .sheet{transform:translateY(0)}
.sheet::-webkit-scrollbar{display:none}
.sheet-handle{width:34px;height:4px;background:var(--border2);border-radius:99px;margin:12px auto 16px}
.sheet-title{font-size:17px;font-weight:650;text-align:center;margin-bottom:14px;padding:0 16px}
.sheet-body{padding:0 16px}
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--surface2);border:0.5px solid var(--border2);border-radius:99px;padding:9px 18px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:all .22s;white-space:nowrap;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mood-card{border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:10px}
.mood-emoji{font-size:48px;line-height:1;flex-shrink:0}
.mood-info{flex:1}
.mood-label{font-size:14px;font-weight:650;margin-bottom:3px}
.mood-msg{font-size:12px;color:var(--text2);line-height:1.5}
.alert-card{border-radius:var(--r-sm);padding:12px 14px;display:flex;align-items:flex-start;gap:10px;margin-bottom:7px;border:0.5px solid}
.member-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:500;cursor:pointer;border:0.5px solid var(--border2);background:var(--surface2);color:var(--text2);transition:all .15s}
.member-chip.on{border-color:var(--green);background:var(--green-dim);color:var(--green)}
.account-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:500;cursor:pointer;border:0.5px solid var(--border2);background:var(--surface2);color:var(--text2);transition:all .15s;margin:3px}
.account-chip.on{border-color:var(--blue);background:var(--blue-dim);color:var(--blue)}
.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.upload-zone{border:1.5px dashed var(--border2);border-radius:var(--r);padding:22px 16px;text-align:center;cursor:pointer;background:var(--surface2)}
.upload-zone p{font-size:13px;color:var(--text3);margin-top:6px;line-height:1.5}
.ia-spinner{width:28px;height:28px;border:2px solid var(--surface3);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ia-item{font-size:13px;color:var(--text);line-height:1.6;padding:9px 12px;background:var(--surface2);border-radius:var(--r-sm);margin-bottom:6px;border-left:2px solid var(--green)}
.ia-item.warn{border-left-color:var(--amber)}.ia-item.danger{border-left-color:var(--red)}.ia-item.tip{border-left-color:var(--purple)}
.info-box{background:var(--surface2);border-radius:var(--r-sm);padding:11px 13px;border:0.5px solid var(--border);font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:10px}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;font-weight:500}
.tag-pdf{background:var(--red-dim);color:var(--red)}.tag-csv{background:var(--green-dim);color:var(--green)}.tag-ofx{background:var(--blue-dim);color:var(--blue)}
/* Comparativo */
.comp-bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.comp-month{font-size:11px;color:var(--text3);width:42px;flex-shrink:0;text-align:right}
.comp-track{flex:1;height:18px;background:var(--surface3);border-radius:4px;overflow:hidden;position:relative}
.comp-fill{height:100%;border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;transition:width .6s ease;min-width:2px}
.comp-val{font-size:10px;font-weight:600;color:rgba(0,0,0,0.7);white-space:nowrap}
/* Planejamento */
.plan-month-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.plan-month-card:active{opacity:.8}
.plan-month-card.atual{border-color:var(--green);background:var(--green-dim)}
.plan-month-card.passado{opacity:.6}
.plan-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.plan-month-name{font-size:15px;font-weight:600}
.plan-badge{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:500}
.plan-prog{height:4px;background:var(--surface3);border-radius:99px;overflow:hidden;margin-top:8px}
.plan-prog-fill{height:100%;border-radius:99px}
.meta-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:8px}
.meta-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.meta-title{font-size:14px;font-weight:600}
.meta-pct{font-size:20px;font-weight:700}
.meta-track{height:8px;background:var(--surface3);border-radius:99px;overflow:hidden}
.meta-fill{height:100%;border-radius:99px;transition:width .6s ease}
/* Alertas */
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
.lembrete-item{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:7px}
.lembrete-ico{font-size:22px;flex-shrink:0}
.lembrete-info{flex:1;min-width:0}
.lembrete-name{font-size:14px;font-weight:500}
.lembrete-meta{font-size:12px;color:var(--text3);margin-top:2px}
.lembrete-val{font-size:14px;font-weight:600;color:var(--red);white-space:nowrap}
.lembrete-status{font-size:11px;padding:3px 8px;border-radius:99px;font-weight:500;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div id="topbar" style="padding-bottom:12px;border-bottom:0.5px solid var(--border)">
    <div style="flex:1">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <div style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--green),#0fa870);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">🏡</div>
        <div>
          <div id="familyName" style="font-size:16px;font-weight:750;letter-spacing:-0.3px;background:linear-gradient(90deg,var(--green),#60d4a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Família Santos</div>
          <div style="font-size:10px;color:var(--text3);letter-spacing:0.05em;margin-top:-1px">GESTÃO FINANCEIRA</div>
        </div>
      </div>
      <div style="display:flex;align-items:baseline;gap:8px">
        <div class="tb-title" id="pageTitle">Resumo</div>
        <div class="tb-sub" id="pageSub">visão geral do mês</div>
      </div>
    </div>
    <button class="month-pill" id="monthPill" onclick="openMonthSheet()">—</button>
  </div>
  <div id="scroller"></div>
  <nav id="navbar">
    <button class="nb-btn active" id="nt-home" onclick="go('home')"><span class="nb-icon">🏠</span>Início</button>
    <button class="nb-btn" id="nt-import" onclick="go('import')"><span class="nb-icon">📂</span>Importar</button>
    <button class="nb-btn" id="nt-add" onclick="go('add')">
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text3);font-size:9px;font-weight:500">
        <div class="nb-add">＋</div>Adicionar
      </div>
    </button>
    <button class="nb-btn" id="nt-ia" onclick="go('ia')"><span class="nb-icon">🤖</span>IA</button>
    <button class="nb-btn" id="nt-plan" onclick="go('plan')"><span class="nb-icon">🗓️</span>Planejar</button>
    <button class="nb-btn" id="nt-cfg" onclick="go('cfg')"><span class="nb-icon">⚙️</span>Config</button>
  </nav>
</div>

<!-- Sheets -->
<div class="overlay" id="sheetCat" onclick="closeSheet('sheetCat',event)"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Categoria</div><div class="sheet-body"><div class="cat-grid" id="catGrid"></div><div style="height:8px"></div></div></div></div>
<div class="overlay" id="sheetMonth" onclick="closeSheet('sheetMonth',event)"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Selecionar mês</div><div class="sheet-body" id="monthBody"></div></div></div>
<div class="overlay" id="sheetTxn" onclick="closeSheet('sheetTxn',event)"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Detalhe</div><div class="sheet-body" id="sheetTxnBody"></div></div></div>
<div class="overlay" id="sheetTxns" onclick="closeSheet('sheetTxns',event)"><div class="sheet" style="max-height:92vh"><div class="sheet-handle"></div><div class="sheet-title" id="sheetTxnsTitle">Gastos</div><div class="sheet-body" id="sheetTxnsBody"></div></div></div>
<div class="overlay" id="sheetPlanMonth" onclick="closeSheet('sheetPlanMonth',event)"><div class="sheet" style="max-height:92vh"><div class="sheet-handle"></div><div class="sheet-title" id="sheetPlanMonthTitle">Planejamento</div><div class="sheet-body" id="sheetPlanMonthBody"></div></div></div>
<div class="overlay" id="sheetMetaLP" onclick="closeSheet('sheetMetaLP',event)"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title" id="sheetMetaLPTitle">Meta de longo prazo</div><div class="sheet-body" id="sheetMetaLPBody"></div></div></div>
<div class="overlay" id="sheetLembrete" onclick="closeSheet('sheetLembrete',event)"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title" id="sheetLembreteTitle">Lembrete</div><div class="sheet-body" id="sheetLembreteBody"></div></div></div>
<div class="overlay" id="sheetMember" onclick="closeSheet('sheetMember',event)"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Membros da Família</div><div class="sheet-body" id="sheetMemberBody"></div></div></div>
<div class="overlay" id="sheetAccount" onclick="closeSheet('sheetAccount',event)"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-title">Contas</div><div class="sheet-body" id="sheetAccountBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════
// PLANEJAMENTO
// ══════════════════════════════════════════════
function renderPlan(){
  const now=new Date();
  const months=[];
  // 2 meses passados + atual + 10 futuros
  for(let i=-2;i<=10;i++){
    const d=new Date(now.getFullYear(),now.getMonth()+i,1);
    months.push(d.toISOString().slice(0,7));
  }
  const curYM=now.toISOString().slice(0,7);

  // Metas de longo prazo
  const metas=S.metasLP||[];
  const totalSaldo=months.slice(0,3).reduce((s,ym)=>{
    const inc=incomesOf(ym).reduce((a,i)=>a+i.val,0);
    const exp=txnsOf(ym).reduce((a,t)=>a+t.val,0);
    return s+(inc-exp);
  },0);

  document.getElementById('scroller').innerHTML=`
    <div style="height:14px"></div>

    <!-- RESUMO PROJETADO -->
    <div class="card span2" style="margin-bottom:10px;background:var(--green-dim);border-color:rgba(34,197,139,.25)">
      <div style="font-size:12px;font-weight:600;color:var(--green);margin-bottom:8px">📈 PROJEÇÃO DOS PRÓXIMOS 3 MESES</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        ${months.slice(2,5).map(ym=>{
          const plan=S.planosMP&&S.planosMP[ym]||{};
          const budgetP=plan.budget||S.budget||0;
          const inc=plan.renda||incomesOf(ym).reduce((s,i)=>s+i.val,0)||0;
          const exp=txnsOf(ym).reduce((s,t)=>s+t.val,0);
          const expP=exp||budgetP;
          const saldo=inc-expP;
          return`<div style="text-align:center">
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px">${monthLabel(ym).split(' ')[0]}</div>
            <div style="font-size:14px;font-weight:650;color:${saldo>=0?'var(--green)':'var(--red)'}">${saldo>=0?'+':''}${fmt(saldo)}</div>
            <div style="font-size:10px;color:var(--text3)">saldo prev.</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- LINHA DO TEMPO MENSAL -->
    <div class="sec" style="margin-top:8px"><span class="sec-title">📅 Linha do tempo</span></div>
    ${months.map(ym=>{
      const isPast=ym<curYM, isCur=ym===curYM;
      const plan=S.planosMP&&S.planosMP[ym]||{};
      const budgetP=plan.budget||S.budget||0;
      const rendaP=plan.renda||incomesOf(ym).reduce((s,i)=>s+i.val,0)||0;
      const gastoReal=txnsOf(ym).reduce((s,t)=>s+t.val,0);
      const gastoPrev=isPast||isCur?gastoReal:(plan.gastosPrev||budgetP||0);

function googleSignIn(){
  if(!GOOGLE_CLIENT_ID){toast('⚙️ Configure o Client ID');return;}
  const client=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID,scope:SCOPES,callback:async res=>{
    if(res.error){driveStatus='error';render();return;}
    driveToken=res.access_token;
    try{const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+driveToken}});const d=await r.json();driveEmail=d.email;localStorage.setItem('drive_email',driveEmail);}catch(e){}
    driveStatus='syncing';render();await syncDrive();
  }});
  client.requestAccessToken();
}
async function syncDrive(){
  if(!driveToken)return;driveStatus='syncing';
  try{
    if(!driveFileId){
      const s=await gf(`https://www.googleapis.com/drive/v3/files?q=name='${DRIVE_FILE}' and trashed=false&fields=files(id)`);
      if(s.files?.length>0){driveFileId=s.files[0].id;localStorage.setItem('drive_fid',driveFileId);
        const c=await gf(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`);
        if(c?.transactions&&c.transactions.length>=S.transactions.length)S={...S,...c};
        else await uploadDrive();saveLocal();
      }else await uploadDrive();
    }else await uploadDrive();
    driveStatus='synced';lastSync=new Date();
  }catch(e){driveStatus='error';}
  if(tab==='cfg')renderCfg();
}
async function uploadDrive(){
  const body=JSON.stringify({...S,_at:new Date().toISOString()});
  const meta={name:DRIVE_FILE,mimeType:'application/json'};
  const b='--bnd';
  const mp=`--${b}\r\nContent-Type:application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type:application/json\r\n\r\n${body}\r\n--${b}--`;
  const url=driveFileId?`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=multipart`:`https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;

// PARSERS
// ══════════════════════════════════════════════
function inferCat(desc){
  const d=desc.toLowerCase();
  if(/mercado|supermercado|atacad|hortifruti|padaria|lanchonete|restaurante|ifood|rappi|uber.eat|pizza|açaí|sushi|delivery/.test(d))return'Alimentação';
  if(/uber|99|combustivel|gasolina|posto|estacionamento|onibus|metro|bilhete|pedágio/.test(d))return'Transporte';
  if(/farmacia|drogaria|hospital|clinic|medico|plano.saude|unimed|amil|hapvida/.test(d))return'Saúde';
  if(/netflix|spotify|amazon|disney|hbo|apple|youtube|prime|deezer|globo|max/.test(d))return'Assinaturas';
  if(/aluguel|condominio|agua|luz|energia|internet|telefone|celular|claro|vivo|tim/.test(d))return'Moradia';
  if(/academia|cinema|teatro|bar|clube|show|ingresso|hotel|airbnb/.test(d))return'Lazer';
  if(/escola|faculdade|curso|livro|papelaria|mensalidade/.test(d))return'Educação';
  if(/roupa|loja|renner|riachuelo|c&a|zara|shein|shopee/.test(d))return'Vestuário';
  return'Outros';
}
function inferType(cat){return['Moradia','Assinaturas','Saúde','Educação'].includes(cat)?'Fixo':'Variável';}
function normDate(s){
  if(!s)return new Date().toISOString().split('T')[0];
  const p=s.split(/[\/\-\.]/);
  if(p.length===3){if(p[0].length===4)return p[0]+'-'+p[1].padStart(2,'0')+'-'+p[2].padStart(2,'0');if(p[2].length===4)return p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0');}
  return new Date().toISOString().split('T')[0];
}
function parseCSV(text,fname){
  const lines=text.trim().split(/\r?\n/);if(lines.length<2)return[];
  const sep=lines[0].includes(';')?';':',';
  const hdr=lines[0].split(sep).map(h=>h.trim().replace(/"/g,'').toLowerCase());
  const di=hdr.findIndex(h=>/data|date|dt/.test(h));
  const ni=hdr.findIndex(h=>/desc|histor|memo|lancamento|estabelec|nome/.test(h));
  const vi=hdr.findIndex(h=>/valor|value|amount|debito|saida|debit/.test(h));
  const ci=hdr.findIndex(h=>/categ/.test(h));
  const results=[];
  for(let i=1;i<lines.length;i++){
    const cols=lines[i].split(sep).map(c=>c.trim().replace(/^"|"$/g,''));
    if(!cols[vi])continue;
    const raw=parseFloat(cols[vi].replace(/[^\d,.\-]/g,'').replace(',','.'));
    if(isNaN(raw)||raw===0)continue;
    if(raw>0&&!(/debito|saida|debit/.test(hdr[vi]||'')))continue;
    const val=Math.abs(raw);
    const desc=ni>=0?cols[ni]||'Lançamento':'CSV';
    const c=ci>=0&&cols[ci]?cols[ci]:inferCat(desc);
    results.push({date:normDate(di>=0?cols[di]:''),desc,cat:c,type:inferType(c),val,source:fname,member:'',account:''});
  }
  return results;
}
function parseOFX(text,fname){
  const results=[];
  const txns=[...text.matchAll(/<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi)];
  txns.forEach(m=>{
    const b=m[1];const get=tag=>{const r=b.match(new RegExp('<'+tag+'>([^<\r\n]+)','i'));return r?r[1].trim():'';};
    const raw=parseFloat(get('TRNAMT'));if(isNaN(raw)||raw>=0)return;
    const val=Math.abs(raw);
    const rd=get('DTPOSTED').substring(0,8);
    const date=rd?rd.replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3'):new Date().toISOString().split('T')[0];
    const desc=get('MEMO')||get('NAME')||'OFX';const c=inferCat(desc);
    results.push({date,desc,cat:c,type:inferType(c),val,source:fname,member:'',account:''});
  });
  return results;
}
function dedup(incoming){
  let added=0,dupes=0;
  incoming.forEach(t=>{
    const isDupe=S.transactions.some(e=>e.date===t.date&&Math.abs(e.val-t.val)<0.01&&(e.desc.toLowerCase().slice(0,8)===t.desc.toLowerCase().slice(0,8)));
    if(!isDupe){S.transactions.push({...t,id:uid()});added++;}else dupes++;
  });
  return{added,dupes};
}

// PDF via IA
// ══════════════════════════════════════════════
async function parsePDFwithAI(file){
  toast('🤖 Lendo PDF com IA...', 8000);
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=async e=>{
      try{
        const base64=e.target.result.split(',')[1];
        const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:4096,messages:[{role:'user',content:[
            {type:'document',source:{type:'base64',media_type:'application/pdf',data:base64}},
            {type:'text',text:`Extraia TODOS os lançamentos de débito/compra deste extrato ou fatura. Retorne APENAS JSON válido sem markdown:
{"transactions":[{"date":"YYYY-MM-DD","desc":"Estabelecimento","cat":"Categoria","type":"Fixo ou Variável","val":valor}]}
Categorias: Alimentação, Transporte, Moradia, Saúde, Lazer, Assinaturas, Educação, Vestuário, Outros.
type=Fixo para: aluguel, plano saúde, mensalidades. Ignore créditos e pagamentos de fatura. val é número positivo.`}
          ]}]})});
        const data=await resp.json();
        const text=data.content?.find(b=>b.type==='text')?.text||'{"transactions":[]}';
        const parsed=JSON.parse(text.replace(/```json|```/g,'').trim());
        resolve((parsed.transactions||[]).map(t=>({...t,source:file.name,member:'',account:''})));
      }catch(err){reject(err);}
    };
    reader.onerror=reject;reader.readAsDataURL(file);
  });
}

async function handleFiles(e){
  const files=Array.from(e.target.files);if(!files.length)return;
  let totalAdded=0,totalDupes=0;
  for(const file of files){
    const ext=file.name.split('.').pop().toLowerCase();
    toast(`📂 Processando ${file.name}...`,6000);
    try{
      let txns=[];
      if(ext==='pdf') txns=await parsePDFwithAI(file);
      else if(ext==='csv'){const text=await file.text();txns=parseCSV(text,file.name);}
      else if(ext==='ofx'||ext==='qfx'){const text=await file.text();txns=parseOFX(text,file.name);}
      if(txns.length>0){const{added,dupes}=dedup(txns);totalAdded+=added;totalDupes+=dupes;}
    }catch(e){toast(`❌ Erro ao ler ${file.name}`);}
  }
  await saveAndSync(false);
  toast(`✅ ${totalAdded} importados${totalDupes>0?' ('+totalDupes+' duplicatas removidas)':''}`,3000);
  render();e.target.value='';
}

async function saveTxn(){
  const val=parseFloat(document.getElementById('fVal').value);
  const desc=document.getElementById('fDesc').value.trim();
  const date=document.getElementById('fDate').value;
  const member=document.getElementById('fMember').value;
  const account=document.getElementById('fAccount').value;
  if(!val||val<=0){toast('⚠️ Informe um valor');return;}
  if(!desc){toast('⚠️ Informe uma descrição');return;}
  S.transactions.push({id:uid(),val,desc,cat:fCat,type:fType,date,member,account,source:'manual'});
  await saveAndSync();go('home');
}
async function saveIncome(){
  const val=parseFloat(document.getElementById('iVal').value);
  const desc=document.getElementById('iDesc').value.trim();
  const type=document.getElementById('iType').value;
  const date=document.getElementById('iDate').value;
  const member=document.getElementById('iMember').value;
  const account=document.getElementById('iAccount').value;
  if(!val||val<=0){toast('⚠️ Informe um valor');return;}
  if(!desc){toast('⚠️ Informe uma descrição');return;}
  S.incomes=S.incomes||[];
  S.incomes.push({id:uid(),val,desc,type,date,member,account});
  await saveAndSync();go('home');
}
async function saveLembrete(){
  const name=document.getElementById('lName').value.trim();
  const val=parseFloat(document.getElementById('lVal').value);
  const dia=parseInt(document.getElementById('lDia').value);
  const account=document.getElementById('lAccount').value;
  if(!name){toast('⚠️ Informe o nome');return;}
  if(!val||val<=0){toast('⚠️ Informe o valor');return;}
  if(!dia||dia<1||dia>31){toast('⚠️ Informe o dia de vencimento');return;}
  S.lembretes=S.lembretes||[];
  S.lembretes.push({id:uid(),name,val,dia,account,icon:selLemIcon,pago:false});
  await saveAndSync();toast('📅 Lembrete criado!');go('home');
}

async function runIAAnalysis(){
  const txns=txnsOf(month);if(txns.length===0){toast('⚠️ Sem gastos no mês');return;}
  iaLoading=true;iaResult=null;render();
  const total=txns.reduce((s,t)=>s+t.val,0);
  const incomes=incomesOf(month);
  const totalInc=incomes.reduce((s,i)=>s+i.val,0);
  const fixed=txns.filter(t=>t.type==='Fixo').reduce((s,t)=>s+t.val,0);
  const catMap={};txns.forEach(t=>{catMap[t.cat]=(catMap[t.cat]||0)+t.val;});
  const memberMap={};txns.forEach(t=>{if(t.member)memberMap[t.member]=(memberMap[t.member]||0)+t.val;});
  const catStr=Object.entries(catMap).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`${c}:R$${v.toFixed(2)}`).join(',');
  const memberStr=Object.entries(memberMap).map(([m,v])=>`${m}:R$${v.toFixed(2)}`).join(',');
  const txnStr=txns.slice(0,80).map(t=>`${t.date}|${t.desc}|${t.cat}|${t.type}|${t.member||'-'}|${t.account||'-'}|R$${t.val.toFixed(2)}`).join('\n');
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:2000,messages:[{role:'user',content:`Você é analista financeiro sênior. Analise os dados da ${S.familyName||'família'} e gere diagnóstico executivo personalizado.

MÊS: ${monthLabel(month)}
RENDA TOTAL: R$${totalInc.toFixed(2)}
GASTOS TOTAIS: R$${total.toFixed(2)}
SALDO: R$${(totalInc-total).toFixed(2)}
FIXOS: R$${fixed.toFixed(2)} (${Math.round(fixed/total*100)}%)
VARIÁVEIS: R$${(total-fixed).toFixed(2)} (${Math.round((total-fixed)/total*100)}%)
POR CATEGORIA: ${catStr}
POR MEMBRO: ${memberStr||'não informado'}

LANÇAMENTOS:
${txnStr}

Retorne APENAS JSON válido sem markdown:
{"ranking":[{"cat":"cat","val":100,"pct":30,"insight":"análise da categoria"}],"parar":[{"titulo":"o que parar","desc":"motivo detalhado","economia":50}],"reduzir":[{"titulo":"onde reduzir","desc":"como reduzir sem cortar","economia":30}],"oportunidades":[{"titulo":"oportunidade","desc":"dica estratégica"}],"meta":{"valor":200,"desc":"justificativa da meta","dicas":["dica1","dica2","dica3"]},"diagnostico":"2-3 frases resumindo o perfil e maior risco"}

Use nomes reais dos estabelecimentos. Seja direto e específico.`}]})});
    const data=await resp.json();
    const text=data.content?.find(b=>b.type==='text')?.text||'{}';
    iaResult=JSON.parse(text.replace(/```json|```/g,'').trim());
  }catch(e){iaResult={error:'Erro na análise. Verifique conexão e tente novamente.'};}
  iaLoading=false;render();
}

function renderPlan(){
  const now=new Date();
  const months=[];
  // 2 meses passados + atual + 10 futuros
  for(let i=-2;i<=10;i++){
    const d=new Date(now.getFullYear(),now.getMonth()+i,1);
    months.push(d.toISOString().slice(0,7));
  }
  const curYM=now.toISOString().slice(0,7);

  // Metas de longo prazo
  const metas=S.metasLP||[];
  const totalSaldo=months.slice(0,3).reduce((s,ym)=>{
    const inc=incomesOf(ym).reduce((a,i)=>a+i.val,0);
    const exp=txnsOf(ym).reduce((a,t)=>a+t.val,0);
    return s+(inc-exp);
  },0);

  document.getElementById('scroller').innerHTML=`
    <div style="height:14px"></div>

    <!-- RESUMO PROJETADO -->
    <div class="card span2" style="margin-bottom:10px;background:var(--green-dim);border-color:rgba(34,197,139,.25)">
      <div style="font-size:12px;font-weight:600;color:var(--green);margin-bottom:8px">📈 PROJEÇÃO DOS PRÓXIMOS 3 MESES</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        ${months.slice(2,5).map(ym=>{
          const plan=S.planosMP&&S.planosMP[ym]||{};
          const budgetP=plan.budget||S.budget||0;
          const inc=plan.renda||incomesOf(ym).reduce((s,i)=>s+i.val,0)||0;
          const exp=txnsOf(ym).reduce((s,t)=>s+t.val,0);
          const expP=exp||budgetP;
          const saldo=inc-expP;
          return`<div style="text-align:center">
            <div style="font-size:11px;color:var(--text3);margin-bottom:4px">${monthLabel(ym).split(' ')[0]}</div>
            <div style="font-size:14px;font-weight:650;color:${saldo>=0?'var(--green)':'var(--red)'}">${saldo>=0?'+':''}${fmt(saldo)}</div>
            <div style="font-size:10px;color:var(--text3)">saldo prev.</div>
          </div>`;
        }).join('')}
      </div>
    </div>

    <!-- LINHA DO TEMPO MENSAL -->
    <div class="sec" style="margin-top:8px"><span class="sec-title">📅 Linha do tempo</span></div>
    ${months.map(ym=>{
      const isPast=ym<curYM, isCur=ym===curYM;
      const plan=S.planosMP&&S.planosMP[ym]||{};
      const budgetP=plan.budget||S.budget||0;
      const rendaP=plan.renda||incomesOf(ym).reduce((s,i)=>s+i.val,0)||0;
      const gastoReal=txnsOf(ym).reduce((s,t)=>s+t.val,0);
      const gastoPrev=isPast||isCur?gastoReal:(plan.gastosPrev||budgetP||0);
      const saldo=rendaP-gastoPrev;
      const pct=budgetP>0?Math.min(100,Math.round(gastoPrev/budgetP*100)):0;
      const barC=pct>=90?'var(--red)':pct>=70?'var(--amber)':'var(--green)';
      const notasCount=(plan.notas||'').length>0?1:0;
      const lemCount=(plan.lembretes||[]).length;
      return`<div class="plan-month-card ${isCur?'atual':isPast?'passado':''}" onclick="openPlanMonth('${ym}')">
        <div class="plan-header">
          <div>
            <div class="plan-month-name">${monthLabel(ym)} ${isCur?'<span style="font-size:11px;color:var(--green)">← atual</span>':''}</div>
            <div style="font-size:12px;color:var(--text3);margin-top:2px">
              ${rendaP>0?`💰 ${fmt(rendaP)}`:'Sem renda planejada'}
              ${lemCount>0?` · 📅 ${lemCount} conta${lemCount>1?'s':''}`:''} 
              ${notasCount>0?' · 📝':''} 
            </div>
          </div>
          <div style="text-align:right">
            <div style="font-size:15px;font-weight:650;color:${saldo>=0?'var(--green)':'var(--red)'}">${saldo!==0?(saldo>0?'+':'')+fmt(saldo):'—'}</div>
            <div style="font-size:11px;color:var(--text3)">${isPast?'realizado':isCur?'em andamento':'previsto'}</div>
          </div>
        </div>
        ${budgetP>0?`<div class="plan-prog"><div class="plan-prog-fill" style="width:${pct}%;background:${barC}"></div></div>`:''}
      </div>`;
    }).join('')}

    <!-- METAS DE LONGO PRAZO -->
    <div class="sec"><span class="sec-title">🏆 Metas de longo prazo</span><button class="sec-action" onclick="openNovaMetaLP()">＋ Nova</button></div>
    ${metas.length===0?`<div class="info-box">Nenhuma meta ainda. Exemplos: reserva de emergência, viagem, carro, reforma da casa...</div>`:''}
    ${metas.map(m=>{
      const pct=m.total>0?Math.min(100,Math.round(m.atual/m.total*100)):0;
      const barC=pct>=100?'var(--green)':pct>=60?'var(--blue)':'var(--amber)';
      const restante=m.total-m.atual;
      const mesesRestantes=m.prazoMeses-(parseInt(curYM.split('-')[0])*12+parseInt(curYM.split('-')[1])-(parseInt(m.criadoEM?.split('-')[0]||curYM.split('-')[0])*12+parseInt(m.criadoEM?.split('-')[1]||curYM.split('-')[1])));
      const portMes=mesesRestantes>0?restante/mesesRestantes:restante;
      return`<div class="meta-card" onclick="openMetaLP('${m.id}')">
        <div class="meta-header">
          <div style="display:flex;align-items:center;gap:10px">
            <div style="font-size:28px">${m.icon||'🎯'}</div>
            <div>
              <div class="meta-title">${m.nome}</div>
              <div style="font-size:12px;color:var(--text3)">${fmt(m.atual)} de ${fmt(m.total)} · ${mesesRestantes>0?mesesRestantes+' meses restantes':'prazo atingido'}</div>
            </div>
          </div>
          <div class="meta-pct" style="color:${barC}">${pct}%</div>
        </div>
        <div class="meta-track"><div class="meta-fill" style="width:${pct}%;background:${barC}"></div></div>
        ${pct<100&&portMes>0?`<div style="font-size:12px;color:var(--text3);margin-top:6px">Poupar <strong style="color:var(--text2)">${fmt(portMes)}/mês</strong> para atingir no prazo</div>`:''}
        ${pct>=100?`<div style="font-size:13px;color:var(--green);margin-top:6px;font-weight:600">🎉 Meta atingida!</div>`:''}
      </div>`;
    }).join('')}
    <div style="height:8px"></div>
  `;
}

function switchPlanTab(tab,ym){
  document.querySelectorAll('[id^="ptab-"]').forEach(b=>b.classList.remove('on'));
  document.getElementById('ptab-'+tab).classList.add('on');
  const plan=S.planosMP[ym]||{};
  const content=document.getElementById('planTabContent');
  if(tab==='plan'){content.innerHTML=renderPlanTab(ym);}
  else if(tab==='notas'){
    content.innerHTML=`
      <textarea id="pm-notas" placeholder="Anotações para ${monthLabel(ym)}..." style="width:100%;height:180px;background:var(--surface2);border:0.5px solid var(--border2);border-radius:var(--r-sm);color:var(--text);font-size:14px;padding:12px;outline:none;resize:none;font-family:inherit;line-height:1.6">${plan.notas||''}</textarea>
      <div style="margin-top:10px"><button class="btn btn-green" onclick="savePlanNotas('${ym}')">💾 Salvar notas</button></div>
      <div style="height:8px"></div>`;
  }
  else if(tab==='lems'){
    const lems=plan.lembretes||[];
    const accountOpts=S.accounts.map(a=>`<option>${a}</option>`).join('');
    content.innerHTML=`
      ${lems.length>0?`<div style="display:flex;flex-direction:column;gap:7px;margin-bottom:12px">
        ${lems.map((l,i)=>`<div style="display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:var(--r-sm);padding:10px 13px">
          <span style="font-size:18px">${l.icon||'📅'}</span>
          <div style="flex:1"><div style="font-size:13px;font-weight:500">${l.name}</div><div style="font-size:11px;color:var(--text3)">Dia ${l.dia} · ${fmt(l.val)}</div></div>
          <button onclick="delPlanLem('${ym}',${i})" style="background:var(--red-dim);border:none;border-radius:6px;color:var(--red);padding:4px 8px;cursor:pointer;font-size:11px">✕</button>
        </div>`).join('')}
      </div>`:'<div class="info-box" style="margin-bottom:12px">Nenhuma conta planejada para este mês.</div>'}
      <div class="form-block" style="margin-bottom:10px">
        <div class="frow"><span class="flabel">Nome</span><input type="text" id="pl-name" placeholder="Ex: Aluguel"></div>
        <div class="frow"><span class="flabel">Valor R$</span><input type="number" id="pl-val" inputmode="decimal" placeholder="0,00" step="0.01"></div>
        <div class="frow"><span class="flabel">Dia venc.</span><input type="number" id="pl-dia" placeholder="Ex: 10" min="1" max="31"></div>
      </div>
      <button class="btn btn-amber" onclick="addPlanLem('${ym}')">＋ Adicionar conta</button>
      <div style="height:8px"></div>`;
  }
}

async function savePlanMonth(ym){
  if(!S.planosMP)S.planosMP={};
  const existing=S.planosMP[ym]||{};
  S.planosMP[ym]={...existing,
    budget:parseFloat(document.getElementById('pm-budget')?.value)||existing.budget||0,
    renda:parseFloat(document.getElementById('pm-renda')?.value)||existing.renda||0,
    gastosPrev:parseFloat(document.getElementById('pm-gastos')?.value)||existing.gastosPrev||0,
  };
  await saveAndSync(false);closeSheet('sheetPlanMonth');renderPlan();toast('✅ Plano salvo!');
}
async function savePlanNotas(ym){
  if(!S.planosMP)S.planosMP={};
  S.planosMP[ym]={...(S.planosMP[ym]||{}),notas:document.getElementById('pm-notas')?.value||''};
  await saveAndSync(false);toast('✅ Notas salvas!');
}
async function addPlanLem(ym){
  const name=document.getElementById('pl-name')?.value.trim();
  const val=parseFloat(document.getElementById('pl-val')?.value);
  const dia=parseInt(document.getElementById('pl-dia')?.value);
  if(!name||!val||!dia){toast('⚠️ Preencha todos os campos');return;}
  if(!S.planosMP)S.planosMP={};
  if(!S.planosMP[ym])S.planosMP[ym]={};
  if(!S.planosMP[ym].lembretes)S.planosMP[ym].lembretes=[];
  S.planosMP[ym].lembretes.push({name,val,dia,icon:'📅'});
  await saveAndSync(false);switchPlanTab('lems',ym);toast('✅ Conta adicionada!');
}
async function delPlanLem(ym,i){
  S.planosMP[ym].lembretes.splice(i,1);await saveAndSync(false);switchPlanTab('lems',ym);toast('🗑 Removida');
}

let selMetaIco='🎯';
function selMetaIcon(e){
  selMetaIco=e;
  document.querySelectorAll('[id^="mi-"]').forEach(b=>b.style.background='var(--surface2)');
  document.getElementById('mi-'+e).style.background='var(--green-dim)';

async function saveMetaLP(){
  const nome=document.getElementById('ml-nome')?.value.trim();
  const total=parseFloat(document.getElementById('ml-total')?.value);
  const atual=parseFloat(document.getElementById('ml-atual')?.value)||0;
  const prazoMeses=parseInt(document.getElementById('ml-prazo')?.value)||12;
  if(!nome||!total){toast('⚠️ Preencha nome e valor total');return;}
  if(!S.metasLP)S.metasLP=[];
  S.metasLP.push({id:uid(),nome,total,atual,prazoMeses,icon:selMetaIco,criadoEM:new Date().toISOString().slice(0,7)});
  await saveAndSync(false);closeSheet('sheetMetaLP');renderPlan();toast('🎯 Meta criada!');
}

function openMetaLP(id){
  const m=(S.metasLP||[]).find(x=>x.id===id);if(!m)return;
  const pct=m.total>0?Math.min(100,Math.round(m.atual/m.total*100)):0;
  document.getElementById('sheetMetaLPTitle').textContent=m.nome;
  document.getElementById('sheetMetaLPBody').innerHTML=`
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:52px;margin-bottom:10px">${m.icon||'🎯'}</div>
      <div style="font-size:22px;font-weight:650">${m.nome}</div>
      <div style="font-size:14px;color:var(--text3);margin-top:4px">${fmt(m.atual)} de ${fmt(m.total)}</div>
      <div style="font-size:32px;font-weight:750;color:${pct>=100?'var(--green)':pct>=60?'var(--blue)':'var(--amber)'};margin-top:8px">${pct}%</div>
      <div class="meta-track" style="margin-top:10px"><div class="meta-fill" style="width:${pct}%;background:${pct>=100?'var(--green)':pct>=60?'var(--blue)':'var(--amber)'}"></div></div>
    </div>
    <div class="form-block" style="margin-bottom:12px">
      <div class="frow"><span class="flabel">Atualizar R$</span><input type="number" id="mu-atual" inputmode="decimal" placeholder="Valor atual poupado" value="${m.atual}" step="100" min="0"></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:8px">
      <button class="btn btn-green" style="flex:2" onclick="updateMetaLP('${id}')">💾 Atualizar</button>
      <button class="btn btn-red" style="flex:1" onclick="delMetaLP('${id}')">🗑</button>
    </div>
    <button class="btn btn-ghost" onclick="closeSheet('sheetMetaLP')">Fechar</button>
    <div style="height:8px"></div>
  `;
  document.getElementById('sheetMetaLP').classList.add('open');
}
async function updateMetaLP(id){
  const m=(S.metasLP||[]).find(x=>x.id===id);if(!m)return;
  m.atual=parseFloat(document.getElementById('mu-atual')?.value)||0;
  await saveAndSync(false);closeSheet('sheetMetaLP');renderPlan();toast('✅ Meta atualizada!');
}
async function delMetaLP(id){
  if(!confirm('Apagar esta meta?'))return;
  S.metasLP=(S.metasLP||[]).filter(x=>x.id!==id);
  await saveAndSync(false);closeSheet('sheetMetaLP');renderPlan();toast('🗑 Meta removida');
}

      <button onclick="addAccount()" class="btn btn-green" style="width:auto;padding:10px 16px">Adicionar</button>
    </div>
    <div style="height:8px"></div>
  `;
  document.getElementById('sheetAccount').classList.add('open');
}
async function addAccount(){
  const name=document.getElementById('newAccount').value.trim();
  if(!name)return;if(S.accounts.includes(name)){toast('⚠️ Conta já existe');return;}
  S.accounts.push(name);await saveAndSync(false);openAccountSheet();toast(`✅ ${name} adicionada!`);
}
async function delAccount(i){S.accounts.splice(i,1);await saveAndSync(false);openAccountSheet();toast('🗑 Removida');}

// ══════════════════════════════════════════════
// SHEET LEMBRETE DETALHE
// ══════════════════════════════════════════════
function openLembreteDetail(id){
  const l=(S.lembretes||[]).find(x=>x.id===id);if(!l)return;
  const today=new Date().getDate();const diff=l.dia-today;
  document.getElementById('sheetLembreteBody').innerHTML=`
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:44px;margin-bottom:8px">${l.icon||'📅'}</div>
      <div style="font-size:22px;font-weight:650">${l.name}</div>
      <div style="font-size:28px;font-weight:700;color:var(--red);margin-top:6px">${fmt(l.val)}</div>
      <div style="font-size:13px;color:var(--text3);margin-top:4px">Vence dia ${l.dia}${l.account?' · '+l.account:''}</div>
      <div style="margin-top:8px">
        ${l.pago?`<span class="badge" style="background:var(--green-dim);color:var(--green);font-size:13px">✓ Pago este mês</span>`:
          diff<0?`<span class="badge" style="background:var(--red-dim);color:var(--red);font-size:13px">⚠️ Vencido!</span>`:
          diff===0?`<span class="badge" style="background:var(--red-dim);color:var(--red);font-size:13px">🔴 Vence hoje!</span>`:
          diff<=3?`<span class="badge" style="background:var(--amber-dim);color:var(--amber);font-size:13px">⚡ Vence em ${diff} dias</span>`:
          `<span class="badge b-src">Vence em ${diff} dias</span>`}
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn ${l.pago?'btn-ghost':'btn-green'}" onclick="togglePago('${id}');closeSheet('sheetLembrete')">${l.pago?'↩ Desfazer pagamento':'✓ Marcar como pago'}</button>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" style="flex:1" onclick="closeSheet('sheetLembrete')">Fechar</button>
        <button class="btn btn-red" style="flex:1" onclick="delLembrete('${id}')">🗑 Apagar</button>
      </div>
    </div><div style="height:8px"></div>
  `;
  document.getElementById('sheetLembrete').classList.add('open');
}
async function delLembrete(id){
  S.lembretes=S.lembretes.filter(l=>l.id!==id);await saveAndSync(false);closeSheet('sheetLembrete');renderCfg();toast('🗑 Lembrete removido');
}

// ══════════════════════════════════════════════
// SHEET TRANSAÇÕES
// ══════════════════════════════════════════════
function openTxnsSheet(type='',cat='',member=''){
  const txns=txnsOf(month);
  let filtered=txns,title='Todos os gastos';
  if(type){filtered=txns.filter(t=>t.type===type);title=`Gastos ${type==='Fixo'?'Fixos':'Variáveis'}`;}
  if(cat){filtered=txns.filter(t=>t.cat===cat);title=`${catOf(cat).e} ${cat}`;}
  if(member){filtered=txns.filter(t=>t.member===member);title=`👤 ${member}`;}
  const sorted=[...filtered].sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('sheetTxnsTitle').textContent=title;
  document.getElementById('sheetTxnsBody').innerHTML=`
    <div style="font-size:13px;color:var(--text3);margin-bottom:12px">${sorted.length} lançamentos · ${fmt(sorted.reduce((s,t)=>s+t.val,0))}</div>
    ${sorted.length===0?`<div style="text-align:center;padding:24px;color:var(--text3)">Nenhum lançamento</div>`:`<div class="txn-list">${sorted.map(t=>txnCard(t,true)).join('')}</div>`}
    <div style="height:8px"></div>
  `;
  document.getElementById('sheetTxns').classList.add('open');
  setTimeout(attachSwipe,100);
}

// ══════════════════════════════════════════════
// DETALHE TRANSAÇÃO
// ══════════════════════════════════════════════
function openTxnDetail(id){
  // verificar se é renda
  const inc=(S.incomes||[]).find(x=>x.id===id);
  if(inc){
    document.getElementById('sheetTxnBody').innerHTML=`
      <div style="text-align:center;margin-bottom:20px">
        <div style="font-size:44px;margin-bottom:8px">💰</div>
        <div style="font-size:28px;font-weight:700;color:var(--green)">+${fmt(inc.val)}</div>
        <div style="font-size:15px;font-weight:500;margin-top:6px">${inc.desc}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:4px">${inc.type||'Renda'} · ${fdate(inc.date)}</div>
        ${inc.member?`<div style="font-size:12px;color:var(--text3)">👤 ${inc.member}</div>`:''}
        ${inc.account?`<div style="font-size:12px;color:var(--text3)">${accountIcon(inc.account)} ${inc.account}</div>`:''}
      </div>
      <div style="display:flex;gap:10px">
        <button class="btn btn-ghost" style="flex:1" onclick="closeSheet('sheetTxn')">Fechar</button>
        <button class="btn btn-red" style="flex:1" onclick="delIncome('${id}')">🗑 Apagar</button>
      </div><div style="height:8px"></div>`;
    document.getElementById('sheetTxn').classList.add('open');return;
  }
  const t=S.transactions.find(x=>x.id===id);if(!t)return;
  const c=catOf(t.cat);
  document.getElementById('sheetTxnBody').innerHTML=`
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:44px;margin-bottom:8px">${c.e}</div>
      <div style="font-size:28px;font-weight:700;color:var(--red)">−${fmt(t.val)}</div>
      <div style="font-size:15px;font-weight:500;margin-top:6px">${t.desc}</div>
      <div style="font-size:12px;color:var(--text3);margin-top:4px">${t.cat} · ${fdate(t.date)}</div>
      ${t.member?`<div style="font-size:12px;color:var(--text3)">👤 ${t.member}</div>`:''}
      ${t.account?`<div style="font-size:12px;color:var(--text3)">${accountIcon(t.account)} ${t.account}</div>`:''}
      <div style="margin-top:8px;display:flex;gap:5px;justify-content:center;flex-wrap:wrap">
        <span class="badge ${t.type==='Fixo'?'b-fixo':'b-var'}">${t.type}</span>
        ${t.source?`<span class="badge b-src">${t.source}</span>`:''}
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="closeSheet('sheetTxn')">Fechar</button>
      <button class="btn btn-red" style="flex:1" onclick="delTxn('${id}')">🗑 Apagar</button>
    </div><div style="height:8px"></div>
  `;
  document.getElementById('sheetTxn').classList.add('open');
}
async function delTxn(id){S.transactions=S.transactions.filter(t=>t.id!==id);await saveAndSync(false);closeSheet('sheetTxn');closeSheet('sheetTxns');toast('🗑 Gasto removido');render();}
async function delIncome(id){S.incomes=(S.incomes||[]).filter(i=>i.id!==id);await saveAndSync(false);closeSheet('sheetTxn');toast('🗑 Renda removida');render();}

// ══════════════════════════════════════════════
// TX CARD
// ══════════════════════════════════════════════
function txnCard(t,showDate=false){
  // verifica se é renda
  if(t.type==='income'||t._income){
    return`<div class="txn-row" onclick="openTxnDetail('${t.id}')">
      <div class="txn-ico" style="background:var(--green-dim)">💰</div>
      <div class="txn-info"><div class="txn-name">${t.desc}</div>
        <div class="txn-meta">${t.type||'Renda'}${showDate?` · ${fdate(t.date)}`:''}${t.member?` · 👤${t.member}`:''}</div>
      </div>
      <div class="txn-amount credit">+${fmt(t.val)}</div>
    </div>`;
  }
  const c=catOf(t.cat);
  return`<div class="swipe-wrap" id="sw-${t.id}">
    <div class="swipe-bg"><span>🗑 Apagar</span></div>
    <div class="txn-row" id="tr-${t.id}" onclick="openTxnDetail('${t.id}')">
      <div class="txn-ico" style="background:${c.c}22">${c.e}</div>
      <div class="txn-info">
        <div class="txn-name">${t.desc}</div>
        <div class="txn-meta">
          ${t.member?`<span>👤${t.member}</span><span>·</span>`:''}
          <span>${t.cat}</span>
          ${showDate?`<span>·</span><span>${fdate(t.date)}</span>`:''}
          ${t.account?`<span>·</span><span>${accountIcon(t.account)}</span>`:''}
          <span class="badge ${t.type==='Fixo'?'b-fixo':'b-var'}">${t.type}</span>
        </div>
      </div>
      <div class="txn-amount debit">−${fmt(t.val)}</div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════
// DADOS
// ══════════════════════════════════════════════
function exportCSV(){
  const all=[
    ...S.transactions.map(t=>['gasto',t.date,t.desc,t.cat,t.type,t.val.toFixed(2).replace('.',','),t.member||'',t.account||'']),
    ...(S.incomes||[]).map(i=>['renda',i.date,i.desc,i.type,'',i.val.toFixed(2).replace('.',','),i.member||'',i.account||''])
  ];
  if(!all.length){toast('⚠️ Nenhum dado');return;}
  const rows=[['Tipo','Data','Descrição','Categoria','Fixo/Variável','Valor','Membro','Conta'],...all];
  const csv=rows.map(r=>r.map(v=>`"${v}"`).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`familia-santos-${month}.csv`;a.click();toast('✅ CSV exportado!');
}
function doImportJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async ev=>{
    try{const d=JSON.parse(ev.target.result);
      if(Array.isArray(d.transactions)){const{added}=dedup(d.transactions);if(d.incomes)S.incomes=[...(S.incomes||[]),...d.incomes];await saveAndSync(false);render();toast(`✅ ${added} lançamentos importados`);}
    }catch{toast('❌ Arquivo inválido');}
  };r.readAsText(f);
}
async function clearTxns(){if(!confirm('Apagar todos os gastos importados?'))return;S.transactions=[];await saveAndSync(false);render();toast('🗑 Gastos apagados');}
async function clearAll(){if(!confirm('Apagar TODOS os dados? Esta ação não pode ser desfeita.'))return;S={...S,transactions:[],incomes:[],lembretes:[]};iaResult=null;await saveAndSync(false);render();toast('🗑 Dados apagados');}

// ══════════════════════════════════════════════
// SHEETS GENÉRICOS
// ══════════════════════════════════════════════
function openCatSheet(){
  document.getElementById('catGrid').innerHTML=CATS.map(c=>`<div class="cat-opt ${fCat===c.k?'on':''}" onclick="selCat('${c.k}')"><span class="cat-ico">${c.e}</span><span class="cat-lbl">${c.k}</span></div>`).join('');
  document.getElementById('sheetCat').classList.add('open');
}
function selCat(k){fCat=k;closeSheet('sheetCat');if(document.getElementById('fCatE')){document.getElementById('fCatE').textContent=catOf(k).e;document.getElementById('fCatK').textContent=k;}}
function openMonthSheet(){
  const months=[];const now=new Date();
  for(let i=0;i<18;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.toISOString().slice(0,7));}
  document.getElementById('monthBody').innerHTML=`<div style="display:flex;flex-direction:column;gap:8px;padding-bottom:8px">
    ${months.map(ym=>`<button onclick="selMonth('${ym}')" style="background:${ym===month?'var(--green-dim)':'var(--surface2)'};border:0.5px solid ${ym===month?'var(--green)':'var(--border)'};border-radius:var(--r-sm);padding:13px 16px;color:${ym===month?'var(--green)':'var(--text)'};font-size:15px;font-weight:${ym===month?'600':'400'};cursor:pointer;text-align:left;display:flex;justify-content:space-between">
      <span>${monthLabel(ym)}</span><span style="font-size:12px;color:var(--text3)">${txnsOf(ym).length} gastos</span>
    </button>`).join('')}
  </div>`;
  document.getElementById('sheetMonth').classList.add('open');
}
function selMonth(ym){month=ym;iaResult=null;closeSheet('sheetMonth');render();}
function closeSheet(id,e){if(e&&e.target!==document.getElementById(id))return;document.getElementById(id).classList.remove('open');}

// ══════════════════════════════════════════════
// SWIPE
// ══════════════════════════════════════════════
function attachSwipe(){
  document.querySelectorAll('.swipe-wrap').forEach(wrap=>{
    const row=wrap.querySelector('.txn-row');let sx=0,dragging=false;
    wrap.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;dragging=true;},{passive:true});
    wrap.addEventListener('touchmove',e=>{if(!dragging)return;const dx=e.touches[0].clientX-sx;if(dx<-5)row.style.transform=`translateX(${Math.max(dx,-90)}px)`;},{passive:true});
    wrap.addEventListener('touchend',e=>{dragging=false;const dx=e.changedTouches[0].clientX-sx;if(dx<-60)row.style.transform='translateX(-90px)';else row.style.transform='translateX(0)';});
  });
}

loadLocal();render();
